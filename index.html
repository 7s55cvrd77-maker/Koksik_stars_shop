<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coconut Stars</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at 50% -10%, #254c40 0%, #101b19 42%, #080d0c 100%);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            overflow-x: hidden;
        }

        /* Пальмы */

        .palm {
            position: fixed;
            top: 95px;
            font-size: 46px;
            opacity: 0.55;
            z-index: 0;
            pointer-events: none;
        }

        .palm-left {
            left: -5px;
            transform: rotate(-12deg);
        }

        .palm-right {
            right: -5px;
            transform: scaleX(-1) rotate(-12deg);
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 520px;
            margin: auto;
            padding: 24px 17px 35px;
        }

        /* Верх */

        .logo {
            text-align: center;
            font-size: 52px;
            margin-top: 3px;
            filter: drop-shadow(0 0 14px rgba(255, 213, 60, 0.25));
        }

        h1 {
            margin: 5px 0 3px;
            text-align: center;
            font-size: 30px;
            font-weight: 800;
        }

        .subtitle {
            text-align: center;
            color: #91a39d;
            font-size: 14px;
            margin-bottom: 26px;
        }

        /* Карточки */

        .card {
            background: rgba(24, 32, 30, 0.94);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 15px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.22);
        }

        .label {
            display: block;
            margin-bottom: 10px;
            color: #aab8b3;
            font-size: 14px;
            font-weight: 600;
        }

        /* Username */

        input {
            width: 100%;
            padding: 16px;

            border: 1px solid transparent;
            border-radius: 14px;

            outline: none;

            background: #101817;
            color: white;

            font-size: 16px;
        }

        input:focus {
            border-color: #ffd43b;
        }

        input::placeholder {
            color: #5d6965;
        }

        /* Stars */

        .stars {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .star-button {
            padding: 16px 8px;

            border: 1px solid #2a3633;
            border-radius: 15px;

            background: #111a18;
            color: white;

            font-size: 16px;
            font-weight: 700;

            cursor: pointer;

            transition: 0.15s;
        }

        .star-button:active {
            transform: scale(0.96);
        }

        .star-button.selected {
            border-color: #ffd43b;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,212,59,0.16),
                    rgba(255,212,59,0.04)
                );

            box-shadow: 0 0 18px rgba(255,212,59,0.08);
        }

        .amount {
            display: block;
            color: #7f8d88;
            font-size: 12px;
            margin-top: 4px;
            font-weight: 500;
        }

        /* Цена */

        .price-box {
            text-align: center;
            margin: 23px 0;
        }

        .price-title {
            color: #899792;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .price {
            font-size: 30px;
            font-weight: 800;
        }

        #price {
            color: #ffd43b;
        }

        /* Купить */

        .buy-button {
            width: 100%;
            padding: 18px;

            border: 0;
            border-radius: 16px;

            background: linear-gradient(
                135deg,
                #ffe16b,
                #ffd43b
            );

            color: #111511;

            font-size: 17px;
            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 8px 25px rgba(255,212,59,0.14);
        }

        .buy-button:active {
            transform: scale(0.97);
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            color: #56635f;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="palm palm-left">🌴</div>
    <div class="palm palm-right">🌴</div>

    <main class="container">

        <div class="logo">⭐</div>

        <h1>Coconut Stars</h1>

        <div class="subtitle">
            Быстрая покупка Telegram Stars
        </div>


        <!-- Username -->

        <div class="card">

            <label class="label">
                👤 Telegram username
            </label>

            <input
                id="username"
                type="text"
                placeholder="@username"
                autocomplete="off"
            >

        </div>


        <!-- Stars -->

        <div class="card">

            <label class="label">
                ⭐ Выберите количество Stars
            </label>

            <div class="stars">

                <button class="star-button"
                    onclick="selectStars(50, this)">
                    ⭐ 50
                    <span class="amount">50 ₽</span>
                </button>

                <button class="star-button"
                    onclick="selectStars(100, this)">
                    ⭐ 100
                    <span class="amount">100 ₽</span>
                </button>

                <button class="star-button"
                    onclick="selectStars(150, this)">
                    ⭐ 150
                    <span class="amount">150 ₽</span>
                </button>

                <button class="star-button"
                    onclick="selectStars(200, this)">
                    ⭐ 200
                    <span class="amount">200 ₽</span>
                </button>

                <button class="star-button"
                    onclick="selectStars(300, this)">
                    ⭐ 300
                    <span class="amount">300 ₽</span>
                </button>

                <button class="star-button"
                    onclick="selectStars(500, this)">
                    ⭐ 500
                    <span class="amount">500 ₽</span>
                </button>

                <button class="star-button"
                    onclick="selectStars(800, this)">
                    ⭐ 800
                    <span class="amount">800 ₽</span>
                </button>

                <button class="star-button"
                    onclick="selectStars(1000, this)">
                    ⭐ 1000
                    <span class="amount">1000 ₽</span>
                </button>

                <button class="star-button"
                    onclick="selectStars(1500, this)">
                    ⭐ 1500
                    <span class="amount">1500 ₽</span>
                </button>

                <button class="star-button"
                    onclick="selectStars(1800, this)">
                    ⭐ 1800
                    <span class="amount">1800 ₽</span>
                </button>

                <button class="star-button"
                    onclick="selectStars(2000, this)">
                    ⭐ 2000
                    <span class="amount">2000 ₽</span>
                </button>

            </div>

        </div>


        <!-- Цена -->

        <div class="price-box">

            <div class="price-title">
                К оплате
            </div>

            <div class="price">
                <span id="price">0 ₽</span>
            </div>

        </div>


        <!-- Кнопка -->

        <button
            class="buy-button"
            onclick="buyStars()"
        >
            ⭐ Купить Stars
        </button>


        <div class="footer">
            🥥 Coconut Stars
        </div>

    </main>


    <script>

        const tg = window.Telegram.WebApp;

        tg.ready();
        tg.expand();


        let selectedStars = 0;


        /* Тестовые цены */

        const prices = {
            50: 50,
            100: 100,
            150: 150,
            200: 200,
            300: 300,
            500: 500,
            800: 800,
            1000: 1000,
            1500: 1500,
            1800: 1800,
            2000: 2000
        };


        function selectStars(amount, button) {

            selectedStars = amount;

            document
                .querySelectorAll(".star-button")
                .forEach(function(item) {
                    item.classList.remove("selected");
                });

            button.classList.add("selected");

            document.getElementById("price").textContent =
                prices[amount] + " ₽";
        }


        function buyStars() {

            const username =
                document.getElementById("username")
                .value
                .trim();


            if (username === "") {

                alert("Введите Telegram username");

                return;
            }


            if (selectedStars === 0) {

                alert("Выберите количество Stars");

                return;
            }


            alert(
                "Заказ создан! ⭐\n\n" +
                "Пользователь: " + username +
                "\nStars: " + selectedStars +
                "\nСумма: " + prices[selectedStars] + " ₽"
            );
        }

    </script>

</body>
</html>
